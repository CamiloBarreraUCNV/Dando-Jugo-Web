<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 716" width="512" height="716">
  <defs>
    <filter id="kShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="30%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#FFF3C4" />
      <stop offset="100%" stop-color="#E07D00" />
    </linearGradient>
    <linearGradient id="royalRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E52D27" />
      <stop offset="100%" stop-color="#B31217" />
    </linearGradient>
  </defs>

  <!-- Base Blanca de la Carta -->
  <g filter="url(#kShadow)">
    <rect x="12" y="12" width="488" height="692" rx="34" fill="#FFFFFF" stroke="#E0D7CC" stroke-width="2" />
    <rect x="14" y="14" width="484" height="688" rx="32" fill="#FDFBF7" />
  </g>

  <!-- Marco Interior Decorativo Real -->
  <rect x="34" y="34" width="444" height="648" rx="20" fill="none" stroke="#E8DFD3" stroke-width="2.5" />
  <rect x="40" y="40" width="432" height="636" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- ESQUINAS: ÍNDICE 'K' + CORONA (Top-Left y Bottom-Right invertido) -->
  <g fill="url(#royalRed)">
    <!-- Top-Left -->
    <text x="66" y="86" font-family="'Arial Black', 'Impact', sans-serif" font-size="52" font-weight="900" text-anchor="middle">K</text>
    <text x="66" y="122" font-size="28" text-anchor="middle">👑</text>

    <!-- Bottom-Right (Rotado 180°) -->
    <g transform="rotate(180 446 630)">
      <text x="446" y="618" font-family="'Arial Black', 'Impact', sans-serif" font-size="52" font-weight="900" text-anchor="middle">K</text>
      <text x="446" y="654" font-size="28" text-anchor="middle">👑</text>
    </g>
  </g>

  <!-- ILUSTRACIÓN CENTRAL: LA COPA DEL REY Y CORONA DERRAMADA -->
  <g transform="translate(256, 340)">
    
    <!-- Aura dorada de la corona -->
    <circle cx="0" cy="-20" r="130" fill="#FFB300" opacity="0.15" filter="url(#royalGlow)" />

    <!-- Marco Oval Central -->
    <ellipse cx="0" cy="0" rx="142" ry="180" fill="#1A1417" stroke="url(#goldGrad)" stroke-width="5" />
    <ellipse cx="0" cy="0" rx="134" ry="172" fill="#120E10" />

    <!-- Copa Central Rebosante de Bebida Dorada -->
    <!-- Base y tallo de la copa -->
    <path d="M -50 95 L 50 95 L 35 110 L -35 110 Z" fill="url(#goldGrad)" stroke="#120E10" stroke-width="2" />
    <rect x="-10" y="40" width="20" height="60" fill="url(#goldGrad)" stroke="#120E10" stroke-width="2" />
    
    <!-- Cáliz / Copa llena de Jugo/Cerveza -->
    <path d="M -65 -20 C -65 50 65 50 65 -20 Z" fill="#FF9400" stroke="url(#goldGrad)" stroke-width="5" />
    <path d="M -55 -15 C -55 40 55 40 55 -15 Z" fill="#FFAA00" />
    
    <!-- Espuma de cerveza / jugo desbordándose -->
    <ellipse cx="0" cy="-20" rx="60" ry="14" fill="#FFFFFF" opacity="0.95" />
    <circle cx="-35" cy="-15" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="-18" r="16" fill="#FFFFFF" />
    <circle cx="35" cy="-15" r="14" fill="#FFFFFF" />
    
    <!-- Gotas cayendo del cáliz -->
    <circle cx="-50" cy="15" r="4.5" fill="#FFAA00" />
    <circle cx="52" cy="22" r="5.5" fill="#FFAA00" />
    <circle cx="40" cy="55" r="3.5" fill="#FFAA00" />

    <!-- CORONA REAL DE ORO INCLINADA ENCIMA -->
    <g transform="translate(0, -75) rotate(-8)">
      <path d="M -55 20 L -65 -30 L -25 -5 L 0 -45 L 25 -5 L 65 -30 L 55 20 Z" fill="url(#goldGrad)" stroke="#120E10" stroke-width="4" stroke-linejoin="round" />
      <!-- Joyas de la corona en colores oficiales (Naranja y Rojo) -->
      <circle cx="-65" cy="-30" r="5" fill="#E52D27" stroke="#120E10" stroke-width="1.5" />
      <circle cx="0" cy="-45" r="6" fill="#FF7A00" stroke="#120E10" stroke-width="1.5" />
      <circle cx="65" cy="-30" r="5" fill="#E52D27" stroke="#120E10" stroke-width="1.5" />
      <!-- Base de la corona -->
      <rect x="-55" y="14" width="110" height="12" rx="4" fill="#E52D27" stroke="#120E10" stroke-width="2" />
      <circle cx="-30" cy="20" r="3" fill="#FFFFFF" />
      <circle cx="0" cy="20" r="3" fill="#FFFFFF" />
      <circle cx="30" cy="20" r="3" fill="#FFFFFF" />
    </g>

    <!-- Cinta / Banner de Texto 'EL CUARTO REY' -->
    <g transform="translate(0, 130)">
      <rect x="-120" y="-18" width="240" height="36" rx="10" fill="url(#royalRed)" stroke="url(#goldGrad)" stroke-width="2.5" />
      <text x="0" y="7" font-family="'Arial Black', 'Impact', sans-serif" font-size="16" font-weight="900" letter-spacing="2.5" fill="#FFFFFF" text-anchor="middle">
        ¡EL CUARTO REY!
      </text>
    </g>
  </g>
</svg>