<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sombra general de la ficha -->
    <filter id="chipShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Resplandor del monograma DJ -->
    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="bodyGrad" cx="38%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#2A2025" />
      <stop offset="60%" stop-color="#181215" />
      <stop offset="100%" stop-color="#0B080A" />
    </radialGradient>

    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="25%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FFF8D6" />
      <stop offset="75%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>

    <radialGradient id="inlayGrad" cx="45%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#261E23" />
      <stop offset="65%" stop-color="#140F12" />
      <stop offset="100%" stop-color="#070506" />
    </radialGradient>

    <linearGradient id="djFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBA52" />
      <stop offset="45%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#D94E00" />
    </linearGradient>

    <linearGradient id="specularGleam" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

